[package]
name = "pglite-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[features]
default = ["napi-binding"]
napi-binding = ["dep:napi", "dep:napi-derive"]

[dependencies]
napi = { version = "2.16.14", default-features = false, features = ["napi4", "async", "serde-json"], optional = true }
napi-derive = { version = "2.16.12", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
rayon = "1.10"
byteorder = "1.5"
bincode = "1.3.3"

[build-dependencies]
napi-build = "2.1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
